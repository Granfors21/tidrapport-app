<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121417">
<meta name="color-scheme" content="dark">
<title>Tidrapport – test</title>
<style>
  @font-face{font-family:"Logo";src:url("fonts/Yellowtail-Regular.ttf") format("truetype");font-display:swap}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#121417;color:#F2F2F2}
  main{width:100%;max-width:420px;padding:32px 24px;text-align:center}
  .card{background:#1C1F24;border-radius:24px;padding:36px 24px 28px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  h1{margin:0;font-family:"Logo",cursive;font-weight:400;font-size:44px;line-height:1.2;color:#E05A6F;text-align:center}
  .sub{margin:0 0 24px;color:#A8AEB7;font-size:15px;font-weight:600;letter-spacing:.04em}
  p{margin:0 0 32px;color:#A8AEB7;font-size:17px}
  a.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;border-radius:16px;background:#B3364A;color:#fff;text-decoration:none;font-size:20px;font-weight:700}
  a.btn:active{background:#C4465A}
  a.btn:focus-visible{outline:3px solid #F07A8C;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Granfors Åkeri AB</h1>
    <div class="sub">Tidrapport</div>
    <p>Detta är en testsida. Knappen nedan går direkt in i appen utan inloggningssida.</p>
    <a class="btn" href="./">Logga in</a>
  </div>
</main>
</body>
</html>
