<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B1E2B">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Tidrapport för maskin, åkeri och anläggning – fungerar offline.">
<title>Tidrapport</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="topl"><div class="logo" id="logo">Tidrapport</div><div class="sub" id="topSub">Tidrapport</div></div>
    <button class="gear" id="gearBtn" aria-label="Inställningar">⚙</button>
  </header>
  <main>
    <section id="view-reg" class="view active"></section>
    <section id="view-days" class="view"></section>
    <section id="view-dev" class="view"></section>
    <section id="view-ata" class="view"></section>
    <section id="view-rep" class="view"></section>
    <section id="view-set" class="view"></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-v="reg" class="on"><span>＋</span>Tid</button>
    <button data-v="days"><span>☰</span>Dagar</button>
    <button data-v="dev"><span>⚠</span>Avvikelse</button>
    <button data-v="ata"><span>✚</span>ÄTA</button>
    <button data-v="rep"><span>▦</span>Rapport</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="lightbox" class="hidden" role="dialog" aria-label="Bild">
  <img id="lbImg" alt="">
  <div class="lbbar"><button id="lbDel" class="danger">Radera bild</button><button id="lbClose" class="primary">Stäng</button></div>
</div>
<div id="sigModal" class="hidden" role="dialog" aria-label="Signatur">
  <div class="sigbox">
    <h2>Signera dagen</h2>
    <p class="muted small" id="sigDate"></p>
    <canvas id="sigCanvas" width="800" height="300"></canvas>
    <input type="text" id="sigName" placeholder="Namnförtydligande">
    <div class="row"><button id="sigClear" class="secondary">Rensa</button><button id="sigCancel" class="secondary">Avbryt</button></div>
    <button id="sigSave" class="primary">Spara signatur</button>
  </div>
</div>
<div id="print"></div>
<script src="app.js"></script>
</body>
</html>
