name: Publicera till GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avkoda binärfiler
        run: |
          mkdir -p _site
          cp -r app/. _site/
          find _site -name '*.b64' | while read f; do base64 -d "$f" > "${f%.b64}"; rm "$f"; done
          touch _site/.nojekyll
          ls -R _site
      - name: Publicera till gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publicera ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
